name: Build Mobile Apps
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pull official Buildozer image
        run: docker pull ghcr.io/kivy/buildozer:latest
      - name: Build APK
        run: |
          printf 'y\ny\ny\ny\n' | docker run --rm -i \
            -e APP_ANDROID_ACCEPT_SDK_LICENSE=1 \
            -v "${{ github.workspace }}:/home/user/hostcwd" \
            -v "${{ github.workspace }}/.buildozer-global:/home/user/.buildozer" \
            ghcr.io/kivy/buildozer:latest \
            android debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: bin/*.apk
          if-no-files-found: error

  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install iOS build dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel cython
          brew install autoconf automake libtool pkg-config
          python -m pip install kivy-ios
      - name: Build Kivy iOS toolchain
        run: |
          toolchain build python3 kivy
      - name: Create Xcode project
        run: |
          toolchain create FloppyBird .
      - name: Upload Xcode project
        uses: actions/upload-artifact@v4
        with:
          name: ios-xcode-project
          path: FloppyBird-ios
          if-no-files-found: error
